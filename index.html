<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>GlowPilot and Tidypane · product film openings (spec samples)</title>
<meta name="description" content="Two 29-second openings for software sales-page films, GlowPilot and Tidypane: cinematic AI shots, software demos, narration, music and sound design.">
<meta property="og:title" content="GlowPilot and Tidypane · product film openings (spec samples)">
<meta property="og:description" content="Two 29-second openings for software sales-page films, GlowPilot and Tidypane: cinematic AI shots, software demos, narration, music and sound design.">
<meta property="og:image" content="https://waxwingfactor.github.io/glowpilot-sample/media/glowpilot-poster.jpg?v=1">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --night: #070B14; --ink: #E9EEF8; --mute: #93A1BD; --glow: #FFB547; --hot: #FFE2A6; --ember: #FF7A3D; --line: rgba(255,255,255,.08); }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: radial-gradient(1200px 700px at 50% -10%, #1A1A2A 0%, var(--night) 60%) fixed, var(--night); color: var(--ink);
         font-family: Inter, system-ui, sans-serif; line-height: 1.55; padding: clamp(36px, 7vh, 72px) 20px 56px; }
  main { width: min(1120px, 100%); margin: 0 auto; }
  .kicker { margin: 0; text-align: center; font-weight: 600; font-size: 12px; letter-spacing: .32em; text-transform: uppercase; color: var(--glow); padding-left: .32em; }
  h1 { font-family: Manrope, Inter, sans-serif; font-weight: 800; font-size: clamp(32px, 4.6vw, 52px); line-height: 1.08; letter-spacing: -.02em; text-align: center; margin: 14px 0 clamp(24px, 4vh, 40px); }
  h1 em { font-style: normal; background: linear-gradient(180deg, var(--hot), var(--glow) 55%, var(--ember)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { text-align: center; color: var(--mute); font-size: 15px; margin: 0 0 clamp(24px, 4vh, 40px); }
  .player { border-radius: 14px; padding: 1px; background: linear-gradient(135deg, rgba(255,181,71,.55), rgba(255,255,255,.06) 40%, rgba(255,122,61,.35));
            box-shadow: 0 30px 90px rgba(0,0,0,.6), 0 0 80px rgba(255,170,60,.10); }
  .player video { display: block; width: 100%; aspect-ratio: 16 / 9; height: auto; border-radius: 13px; background: #000; object-fit: contain; }
  video:fullscreen, video:-webkit-full-screen { object-fit: contain; width: 100%; height: 100%; max-width: none; border-radius: 0; }
  h2 { font-family: Manrope, Inter, sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -.01em; margin: 0 0 18px; }
  section { margin-top: clamp(44px, 7vh, 72px); }
  .cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
  .card { border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; background: rgba(255,255,255,.025); }
  .card b { display: flex; align-items: center; gap: 10px; font-family: Manrope, Inter, sans-serif; font-weight: 700; font-size: 17px; margin-bottom: 6px; }
  .card b i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--glow); box-shadow: 0 0 8px var(--glow); flex: none; }
  .card p { margin: 0; color: var(--mute); font-size: 14.5px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  figure { margin: 0; }
  figure img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); }
  figcaption { margin-top: 10px; font-size: 14px; color: var(--mute); }
  figcaption b { color: var(--ink); font-weight: 600; }
  .film2 { margin-top: clamp(72px, 11vh, 120px); padding-top: clamp(48px, 7vh, 72px); border-top: 1px solid var(--line); }
  .film2 .kicker { color: #3FD6C4; }
  .film2 h1 em { background: linear-gradient(180deg, #A7F3E8, #0FB5A3 60%, #0A8F82); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .film2 .player { background: linear-gradient(135deg, rgba(63,214,196,.55), rgba(255,255,255,.06) 40%, rgba(15,181,163,.35)); box-shadow: 0 30px 90px rgba(0,0,0,.6), 0 0 80px rgba(15,181,163,.10); }
  .film2 .card b i { border-color: #3FD6C4; box-shadow: 0 0 8px #3FD6C4; }
  .note { margin-top: clamp(40px, 6vh, 60px); padding-top: 22px; border-top: 1px solid var(--line); color: var(--mute); font-size: 13.5px; text-align: center; }
  .note p { margin: 0 auto 6px; max-width: 760px; }
  @media (max-width: 820px) { .cols, .pair { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <p class="kicker">Spec sample · GlowPilot</p>
  <h1>The first 29 seconds of a <em>GlowPilot</em> sales film</h1>

  <div class="player">
    <video controls playsinline preload="metadata" poster="media/glowpilot-poster.jpg?v=1">
      <source src="media/glowpilot-snippet.mp4?v=1" type="video/mp4">
    </video>
  </div>

  <section>
    <h2>Behind one shot</h2>
    <div class="pair">
      <figure><img src="media/hall-plate.jpg?v=1" alt="Generated auditorium plate with a blank projection screen" loading="lazy"><figcaption><b>Generated plate.</b> A locked-off camera and a blank screen, so the screen can be replaced.</figcaption></figure>
      <figure><img src="media/hall-final.jpg?v=1" alt="Final frame with the presenter's slide pinned onto the screen" loading="lazy"><figcaption><b>Final frame.</b> The deck from the demo is pinned onto the screen, and its tiny default cursor is lost at the back of the room.</figcaption></figure>
    </div>
  </section>

  <div class="film2">
    <p class="kicker">Second sample</p>
    <h1><em>Tidypane</em></h1>

    <div class="player">
      <video controls playsinline preload="metadata" poster="media/tidypane-poster.jpg?v=1">
        <source src="media/tidypane-snippet.mp4?v=1" type="video/mp4">
      </video>
    </div>

    <section>
      <h2>Behind one shot</h2>
      <div class="pair">
        <figure><img src="media/desk-plate.jpg?v=1" alt="Generated loft shot with a blank monitor" loading="lazy"><figcaption><b>Generated plate.</b> The monitor was generated blank, with a locked-off camera.</figcaption></figure>
        <figure><img src="media/desk-final.jpg?v=1" alt="Final frame with a cluttered desktop fitted onto the angled monitor" loading="lazy"><figcaption><b>Final frame.</b> A cluttered desktop is fitted onto the angled screen in perspective, with focus hopping between windows.</figcaption></figure>
      </div>
    </section>
  </div></main>
</body>
</html>
